server:
  port: 6000

spring:
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: NON_NULL
  mvc:
    dispatch-options-request: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

logging:
  file:
    name: ./logs/template-java.log
  level:
    org.springframework.web: INFO