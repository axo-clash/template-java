include:
  - project: 'open/axodevsecops'
    ref: 1.14.0
    file:
      - '/build/maven.yml'
      - '/dependency-track/maven.yml'
      - '/sonar/maven.yml'
      - '/tools/tags.yml'
      - '/tools/release.yml'

.ONLY_MERGE_REQUEST_NO_DRAFT:
  if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE !~ "/^(draft:|\[draft\])/i"

.ONLY_PROTECTED_BRANCH:
  if: $CI_COMMIT_REF_PROTECTED == "true"

variables:
  JDK_VERSION: "21"
  MAVEN_VERSION: "3.9.7"
  JDK_DISTRIBUTION: "eclipse-temurin"
  MAVEN_ARGS: "-DskipTests --quiet"

workflow:
  rules:
    - !reference [.ONLY_MERGE_REQUEST_NO_DRAFT]
    - if: !reference [ .on_rc_if, if ]
      variables:
        MAVEN_ARGS: "-DskipTests --quiet -Prec"
        DEPLOY_ENV: "rec"
    - if: !reference [.on_prd_if, if]
      variables:
        MAVEN_ARGS: "-DskipTests --quiet -Pprod"
        DEPLOY_ENV: "prod"
    - !reference [.ONLY_PROTECTED_BRANCH]
    - when: never

stages:
  - build
  - test
  - deploy
  - release

build:
  stage: build
  extends:
    - .build:maven

test:sonar:
  stage: test
  extends: .sonar:maven
  allow_failure: false
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  rules:
    - if: !reference [ .on_no_tags_if, if ]
    - when: never

# Analyses Dependency Track
test:dependency-track:
  extends: .dependency-track:maven
  stage: test
  needs: []
  dependencies: []
  rules:
    - if: !reference [.on_no_tags_if, if]
      changes:
        - "**/pom.xml"
    - if: !reference [.on_no_tags_if, if]
      when: manual
      allow_failure: true
    - if: !reference [.on_tags_if, if]
    - when: never

test:dependency-track:publish:
  extends: .dependency-track:maven:publish
  stage: test
  needs:
    - job: test:dependency-track
      artifacts: true
  dependencies:
    - test:dependency-track
  rules:
    # Lorsqu'il n'y a pas de tag, ce job sera exécuté et autorise que le job fail
    - if: !reference [ .on_no_tags_if, if ]
    - if: !reference [.on_tags_if, if]
    - when: never

release:prepare:
  stage: release
  extends: .release:prepare
  needs:
    - build
  rules:
    # Ce job ne se lancera de façon manuelle dans le contexte d'une pipeline lié à un tag
    - if: !reference [.on_tags_if, if]
    - when: never

release:publish:
  stage: release
  extends: .release:publish
  needs:
    - job: release:prepare
      artifacts: true
  dependencies:
    - release:prepare
  rules:
    # Ce job ne se lancera de façon manuelle dans le contexte d'une pipeline lié à un tag
    - if: !reference [.on_tags_if, if]
    - when: never